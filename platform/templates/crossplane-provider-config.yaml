{{- if .Values.crossplane.secretPath }}
apiVersion: aws.upbound.io/v1beta1
kind: ProviderConfig
metadata:
  name: default
spec:
  credentials:
    source: Secret
    secretRef:
      namespace: crossplane-system
      name: crossplane-aws-credentials
      key: creds
  region: {{ .Values.crossplane.region }}
{{- end }}
